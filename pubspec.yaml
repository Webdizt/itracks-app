name: itracks_app
description: A modern Inventory Management System

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Networking
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI Components
  google_fonts: ^6.1.0  # ✅ Font akan di-load dari internet
  flutter_svg: ^2.0.9
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  
  # Responsive
  flutter_screenutil: ^5.9.0
  
  # Utils
  intl: ^0.18.1
  connectivity_plus: ^5.0.2
  
  # Barcode & QR - Cross Platform
  mobile_scanner: ^3.5.6
  #qr_code_scanner: ^1.0.1

  
  # Permission Handler (iOS & Android)
  permission_handler: ^11.3.0
  
  device_info_plus: ^10.1.0        # atau versi latest
  flutter_local_notifications: ^17.2.1  # atau versi latest
  
  # Path Provider (iOS & Android)
  path_provider: ^2.1.2
  open_filex: ^4.5.0
  torch_light: ^1.0.0

  # Image Picker (iOS & Android)
  image_picker: ^1.0.7
  internet_connection_checker: ^1.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    - assets/app_icon/ 

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true  # iOS tidak boleh ada alpha channel
  adaptive_icon_background: "#FFFFFF"  # Background Android adaptive icon
  adaptive_icon_foreground: "assets/app_icon/icon_foreground.png"  #     
  
  # ✅ HAPUS SEMUA FONTS - gunakan google_fonts saja
